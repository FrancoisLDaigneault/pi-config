name: Demande de fonctionnalité
description: Proposer une amélioration
labels: [enhancement]
body:
  - type: textarea
    id: probleme
    attributes:
      label: Problème à résoudre
      description: Le besoin réel, pas la solution.
    validations:
      required: true
