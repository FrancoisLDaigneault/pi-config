name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    # ouvre/actualise une PR de release a partir des Conventional Commits;
    # release-type python met a jour la version dans pyproject.toml et le CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: python
