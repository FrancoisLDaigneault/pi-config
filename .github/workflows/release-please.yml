name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    # opens/refreshes a release PR from the Conventional Commits;
    # config lives in release-please-config.json (release-type python bumps
    # pyproject.toml and the CHANGELOG; an extra-files toml updater keeps the
    # pi-config-tools version in uv.lock in sync with the release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
