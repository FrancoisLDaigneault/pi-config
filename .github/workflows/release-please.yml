name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    # opens/refreshes a release PR from the Conventional Commits;
    # config lives in .github/release-please/ (release-type python bumps
    # pyproject.toml and the CHANGELOG; an extra-files toml updater keeps the
    # pi-config-tools version in uv.lock in sync with the release -- extra-files
    # paths stay relative to the package path ".", i.e. the repo root)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json

  release-assets:
    # when a release was just created: build wheel+sdist, export the SPDX SBOM
    # from GitHub's dependency graph, checksum everything, attest build
    # provenance (SLSA) and upload the lot to the GitHub release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - name: Export SPDX SBOM from the dependency graph
        run: gh api "repos/$REPO/dependency-graph/sbom" --jq .sbom > dist/sbom.spdx.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
      - name: Write SHA-256 checksums
        run: sha256sum * > SHA256SUMS
        working-directory: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload assets to the release
        run: gh release upload "$TAG" dist/* --clobber -R "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
