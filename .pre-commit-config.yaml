# Pre-commit framework configuration (https://pre-commit.com).
# Enable with: uv run pre-commit install --install-hooks (done by `just setup`).
# Mirror hooks are pinned to tags matching the versions locked in uv.lock;
# mypy, pytest and deptry run as local system hooks so they use the project
# venv (the isolated mypy mirror cannot see our dependencies and drifts
# from CI - see ADR-0010).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        # config/ is a byte-faithful live-machine snapshot: never touch it
        exclude: ^config/
      - id: trailing-whitespace
        exclude: ^config/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # rev matches the ruff version in uv.lock
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    # rev matches the uv version pinned in CI (setup-uv "version:")
    rev: 0.11.19
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: mypy
        name: mypy (project venv)
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: deptry
        name: deptry (stdlib-only invariant)
        entry: uv run deptry src
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest (full suite, coverage floor)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
