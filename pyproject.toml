[project]
name = "pi-config-tools"
version = "0.6.2"
description = "Sync, restore and backup tools for the Pi configuration"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_config_tools"]

[dependency-groups]
dev = [
    "deptry>=0.25.1,<0.26",
    "hypothesis>=6.165.10",
    "import-linter>=2.13,<3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "ty>=0.0.73",
]

[tool.ruff]
line-length = 100
# config/ is a live-machine snapshot, never hand-edited: the style gates skip it
# (gitleaks and the test suite still cover it - ADR-0003)
extend-exclude = ["config"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PL", "C90", "S", "N", "B", "C4", "SIM", "PERF", "RUF", "TID"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 30
max-args = 5

[tool.ruff.lint.per-file-ignores]
# Tests compare literal counts and contents: PLR2004 is noise there.
# S101: pytest tests assert by design. Tests and wrappers are not production modules.
"scripts/*" = ["TID251"]
"tests/*" = ["PLR2004", "S101", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"scripts".msg = "Production modules must not import command wrappers."
"tests".msg = "Production modules must not import test code."

[tool.deptry]
# The runtime package is stdlib-only (dependencies = []); deptry keeps that
# invariant honest by flagging any non-stdlib import that sneaks into src/.
extend_exclude = ["config"]

[tool.importlinter]
root_package = "pi_config_tools"

[[tool.importlinter.contracts]]
name = "Command modules are independent"
type = "independence"
modules = [
    "pi_config_tools.backup",
    "pi_config_tools.restore",
    "pi_config_tools.sync",
]

[[tool.importlinter.contracts]]
name = "Secrets remain an isolated policy module"
type = "forbidden"
source_modules = ["pi_config_tools.secrets"]
forbidden_modules = [
    "pi_config_tools.paths",
    "pi_config_tools.fsops",
    "pi_config_tools.patched",
    "pi_config_tools.backup",
    "pi_config_tools.restore",
    "pi_config_tools.sync",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage rides every pytest run (pre-commit hook, CI, just check).
# Measured baseline at introduction: 93% with branch coverage.
addopts = "--cov=pi_config_tools --cov-fail-under=90"

[tool.coverage.run]
# Branch coverage is stricter than line coverage and still leaves headroom
# above the 90% floor; untested conditionals matter in a backup/restore tool.
branch = true

[tool.coverage.report]
show_missing = true

[tool.ty.environment]
python-version = "3.12"

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]
python_version = "3.12"

[tool.pyright]
# point pyright-based checkers (including editor integrations) at the uv venv
venvPath = "."
venv = ".venv"
