[project]
name = "pi-config-tools"
version = "0.4.2"
description = "Sync, restore and backup tools for the Pi configuration"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_config_tools"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
# config/ is a live-machine snapshot, never hand-edited: keep every gate off it
extend-exclude = ["config"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PL", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 30
max-args = 5

[tool.ruff.lint.per-file-ignores]
# Tests compare literal counts and contents: PLR2004 is noise there.
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage rides every pytest run (pre-commit hook, CI, just check).
# Measured baseline at introduction: 93% with branch coverage.
addopts = "--cov=pi_config_tools --cov-fail-under=90"

[tool.coverage.run]
# Branch coverage is stricter than line coverage and still leaves headroom
# above the 90% floor; untested conditionals matter in a backup/restore tool.
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]
python_version = "3.12"

[tool.pyright]
# point pyright-based checkers (including editor integrations) at the uv venv
venvPath = "."
venv = ".venv"
